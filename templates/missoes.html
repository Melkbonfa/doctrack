<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missões — DocTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/missoes.css?v={{ asset_v }}">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body>
<div id="app">
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
  <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Abrir menu" aria-controls="sidebar-nav" aria-expanded="false">☰</button>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar-nav" aria-label="Navegação principal">
    <div class="sidebar-brand">
      <div class="brand-row">
        <div class="brand-icon"><svg width="18" height="18" fill="none" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5" fill="#67e8f9"/><rect x="10" y="4" width="5" height="10" rx="1.5" fill="#06b6d4" opacity=".7"/><rect x="17" y="4" width="4" height="13" rx="1.5" fill="#0891b2" opacity=".5"/></svg></div>
        <div class="brand-name">DocTrack</div>
      </div>
      <div class="brand-version">MISSÕES</div>
    </div>
    <div class="sidebar-user">
      <div class="user-avatar" id="nav-avatar">A</div>
      <div><div class="user-name" id="nav-name">—</div><div class="user-role" id="nav-role">—</div></div>
    </div>

    <span class="nav-section-label">Visão</span>
    <button type="button" class="nav-item" id="btn-meus-cartoes">
      <svg class="nav-icon" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M5 19c1.2-3 3.8-4.5 7-4.5s5.8 1.5 7 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Meus cartões <span id="meus-badge" style="font-size:10px;color:var(--t4);margin-left:auto"></span>
    </button>

    <span class="nav-section-label">Missões</span>
    <div id="lista-missoes"><!-- itens dinâmicos --></div>
    <button type="button" class="nav-item" id="btn-nova-missao">
      <svg class="nav-icon" fill="none" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Nova missão
    </button>

    <div class="sidebar-footer">
      <div class="sync-row"><div class="sync-dot"></div><span class="sync-text" id="sync-label">Conectado</span></div>
      <a class="sidebar-refresh" href="#" onclick="location.href='/hub/'+(sessionStorage.getItem('dt_area')||'pde');return false;" style="text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px">
        <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Voltar aos módulos
      </a>
      <button class="sidebar-refresh" style="margin-top:8px" onclick="loadAll()">Atualizar dados</button>
      <button class="sidebar-refresh" style="margin-top:8px" onclick="doLogout()">Sair</button>
    </div>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="breadcrumb"><span>DocTrack</span><span style="color:var(--t4)">/</span><span>Missões</span><span style="color:var(--t4)">/</span><span class="current" id="breadcrumb-current">—</span></div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" type="button" id="btn-editar-missao" style="display:none">✎ Editar</button>
        <button class="btn btn-ghost btn-sm" type="button" id="btn-excluir-missao" style="display:none">🗑</button>
        <button id="theme-toggle" class="btn btn-ghost btn-sm" type="button" onclick="toggleTheme()" title="Alternar tema" style="padding:6px 10px;font-size:14px;line-height:1">🌙</button>
      </div>
    </div>

    <main id="main-content" class="content">
      <div id="board-vazio" class="board-vazio">
        <div class="board-vazio-inner">
          <div style="font-size:38px">🎯</div>
          <h2>Nenhuma missão selecionada</h2>
          <p>Crie uma missão nova ou escolha uma na barra lateral.</p>
          <button class="btn btn-primary" onclick="abrirModalMissao()">＋ Nova missão</button>
        </div>
      </div>
      <div id="board" class="board" style="display:none"><!-- colunas dinâmicas --></div>
      <div id="meus" class="meus" style="display:none"><!-- meus cartões (cross-missão) --></div>
    </main>
  </div>
</div>

<!-- MODAL: nova/editar missão -->
<div class="modal-backdrop" id="modal-missao" style="display:none">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-missao-titulo">Nova missão</h3><button class="modal-x" onclick="fecharModal('modal-missao')">×</button></div>
    <div class="modal-body">
      <label class="fld"><span>Nome *</span><input id="mi-nome" maxlength="160" placeholder="Ex.: Lançamento Linha X"></label>
      <label class="fld"><span>Descrição</span><textarea id="mi-descricao" rows="3" placeholder="Objetivo da missão (opcional)"></textarea></label>
      <label class="fld"><span>Cor de destaque</span><input id="mi-accent" type="color" value="#22d3ee"></label>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="fecharModal('modal-missao')">Cancelar</button>
      <button class="btn btn-primary" id="mi-salvar">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL: nova/editar coluna -->
<div class="modal-backdrop" id="modal-coluna" style="display:none">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-coluna-titulo">Nova coluna</h3><button class="modal-x" onclick="fecharModal('modal-coluna')">×</button></div>
    <div class="modal-body">
      <label class="fld"><span>Nome *</span><input id="co-nome" maxlength="80" placeholder="Ex.: Em revisão"></label>
      <label class="fld"><span>Categoria (para relatórios)</span>
        <select id="co-categoria">
          <option value="">— sem categoria —</option>
          <option value="todo">A fazer</option>
          <option value="doing">Em andamento</option>
          <option value="done">Concluído</option>
        </select>
      </label>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="fecharModal('modal-coluna')">Cancelar</button>
      <button class="btn btn-primary" id="co-salvar">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL: cartão -->
<div class="modal-backdrop" id="modal-cartao" style="display:none">
  <div class="modal modal-lg">
    <div class="modal-head"><h3 id="modal-cartao-titulo">Cartão</h3><button class="modal-x" onclick="fecharModal('modal-cartao')">×</button></div>
    <div class="modal-body">
      <label class="fld"><span>Título *</span><input id="ca-titulo" maxlength="200"></label>
      <label class="fld"><span>Descrição</span><textarea id="ca-descricao" rows="4" placeholder="Detalhes do cartão (opcional)"></textarea></label>
      <div class="fld-row">
        <label class="fld"><span>Prazo</span><input id="ca-prazo" type="date"></label>
        <label class="fld"><span>Prioridade</span>
          <select id="ca-prioridade">
            <option value="baixa">Baixa</option>
            <option value="media" selected>Média</option>
            <option value="alta">Alta</option>
            <option value="urgente">Urgente</option>
          </select>
        </label>
      </div>
      <div class="fld-row">
        <label class="fld"><span>Responsáveis</span>
          <select id="ca-resp-select"><option value="">＋ adicionar responsável…</option></select>
          <div class="resp-chips" id="ca-resp-chips"></div>
        </label>
        <label class="fld"><span>Etiquetas</span><input id="ca-etiquetas" placeholder="Ex.: hardware, urgência"></label>
      </div>
      <div class="fld-row">
        <label class="fld"><span>Vincular a</span>
          <select id="ca-ref-tipo">
            <option value="">— sem vínculo —</option>
            <option value="equipamento">Equipamento</option>
            <option value="projeto">Projeto</option>
            <option value="documento">Documento</option>
          </select>
        </label>
        <label class="fld"><span>&nbsp;</span>
          <select id="ca-ref-id" disabled><option value="">—</option></select>
        </label>
      </div>
      <label class="fld fld-check"><input type="checkbox" id="ca-concluido"> <span>Concluído</span></label>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="ca-excluir" style="margin-right:auto">Excluir</button>
      <button class="btn btn-ghost" onclick="fecharModal('modal-cartao')">Cancelar</button>
      <button class="btn btn-primary" id="ca-salvar">Salvar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>
<script src="/static/auth.js?v={{ asset_v }}"></script>
<script src="/static/missoes.js?v={{ asset_v }}"></script>
</body>
</html>
