<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocTrack — Módulos</title>
<link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
<style>
  body{
    background:var(--bg-void);color:var(--t1);
    font-family:var(--font-body);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .hub{width:100%;max-width:620px;text-align:center}
  .brand{color:var(--cyan);font-size:12px;font-weight:700;letter-spacing:3px;margin-bottom:14px}
  .hello{font-size:21px;color:var(--t1);font-weight:600;margin-bottom:6px}
  .sub{color:var(--t3);font-size:14px;margin-bottom:36px}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}

  .hubcard{
    position:relative;overflow:hidden;cursor:pointer;
    background:var(--bg-card);border:1px solid var(--border-dim);
    border-radius:var(--r3);padding:40px 26px 30px;
    display:flex;flex-direction:column;align-items:center;gap:20px;
    transition:transform .28s cubic-bezier(.2,.8,.2,1),border-color .28s,box-shadow .28s;
    -webkit-tap-highlight-color:transparent;
  }
  /* brilho radial na cor de acento que aparece no hover */
  .hubcard::before{
    content:'';position:absolute;left:50%;top:-30%;width:240px;height:240px;
    transform:translateX(-50%) scale(.6);
    background:radial-gradient(circle,var(--glow) 0%,transparent 68%);
    opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;
  }
  .hubcard:hover,.hubcard:focus-visible{
    transform:translateY(-7px);border-color:var(--accent);
    box-shadow:0 20px 44px -14px var(--glow),0 0 0 1px var(--accent) inset;
    outline:none;
  }
  .hubcard:hover::before,.hubcard:focus-visible::before{opacity:1;transform:translateX(-50%) scale(1)}
  .hubcard:active{transform:translateY(-2px) scale(.985)}

  .hubcard .ico{
    position:relative;z-index:1;
    width:72px;height:72px;
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);
  }
  /* halo suave atrás do ícone (sem caixa quadrada) */
  .hubcard .ico::after{
    content:'';position:absolute;inset:-10px;border-radius:50%;z-index:-1;
    background:radial-gradient(circle,var(--accent-bg) 0%,transparent 70%);
    opacity:.85;transition:opacity .3s,transform .3s;
  }
  .hubcard .ico svg{width:54px;height:54px;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .hubcard:hover .ico svg{transform:scale(1.1) translateY(-3px)}
  .hubcard:hover .ico::after{opacity:1;transform:scale(1.18)}

  .hubcard h2{position:relative;z-index:1;font-size:23px;font-weight:700;margin:0;color:var(--t1);letter-spacing:-.4px}

  .hubcard .arrow{
    position:relative;z-index:1;
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border-soft);color:var(--t3);
    opacity:0;transform:translateY(6px);
    transition:opacity .28s,transform .28s,color .28s,border-color .28s,background .28s;
  }
  /* ao passar no card a seta só aparece (contorno discreto) */
  .hubcard:hover .arrow{opacity:1;transform:translateY(0)}
  /* só acende (ciano) quando o mouse está sobre a própria seta */
  .hubcard .arrow:hover{color:#fff;background:var(--accent);border-color:var(--accent)}
  .hubcard .arrow svg{transition:transform .28s}
  .hubcard .arrow:hover svg{transform:translateX(3px)}

  #card-docs{--accent:#22d3ee;--glow:rgba(34,211,238,.22);--accent-bg:rgba(34,211,238,.10);--accent-bd:rgba(34,211,238,.28)}
  #card-ent{--accent:#10b981;--glow:rgba(16,185,129,.22);--accent-bg:rgba(16,185,129,.10);--accent-bd:rgba(16,185,129,.28)}

  .foot{margin-top:40px;font-size:12.5px;color:var(--t3)}
  .foot a{color:var(--cyan);text-decoration:none;margin-left:10px;cursor:pointer}
  .foot a:hover{text-decoration:underline}

  @media (prefers-reduced-motion:reduce){
    .hubcard,.hubcard .ico,.hubcard .arrow,.hubcard .arrow svg,.hubcard::before{transition:none}
  }
</style>
</head>
<body>
  <div class="hub">
    <div class="brand">DOCTRACK</div>
    <div class="hello" id="hello">Bem-vindo</div>
    <div class="sub">Escolha por onde quer começar</div>
    <div class="cards">
      <div class="hubcard" id="card-docs" role="button" tabindex="0" aria-label="Entrar em Documentos">
        <div class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 9h1"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
        </div>
        <h2>Documentos</h2>
        <div class="arrow" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="hubcard" id="card-ent" role="button" tabindex="0" aria-label="Entrar em Entregáveis">
        <div class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="4" rx="2"/><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="M9 12l1.5 1.5L13 11"/><path d="M9 16l1.5 1.5L13 15"/></svg>
        </div>
        <h2>Entregáveis</h2>
        <div class="arrow" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </div>
    <div class="foot"><span id="foot-email"></span><a id="theme-toggle" onclick="toggleTheme()" title="Alternar tema claro/escuro">🌙 Tema</a><a id="logout">Sair</a></div>
  </div>
<script>
// ═══ TEMA CLARO/ESCURO (mesma chave de Documentos/Entregáveis) ═══
function applyTheme(theme){
  var isLight = theme === 'light';
  document.body.classList.toggle('theme-light', isLight);
  var btn = document.getElementById('theme-toggle');
  if(btn) btn.textContent = isLight ? '☀️ Tema' : '🌙 Tema';
}
function toggleTheme(){
  var next = document.body.classList.contains('theme-light') ? 'dark' : 'light';
  localStorage.setItem('doctrack_theme', next);
  applyTheme(next);
}
applyTheme(localStorage.getItem('doctrack_theme') || 'dark');

(function(){
  var token = localStorage.getItem('doctrack_token') || '';
  if(!token){ window.location.href = '/'; return; }

  var user = {};
  try { user = JSON.parse(localStorage.getItem('doctrack_user') || '{}') || {}; } catch(e){}
  if(user.nome) document.getElementById('hello').textContent = 'Bem-vindo, ' + user.nome;
  if(user.email) document.getElementById('foot-email').textContent = user.email;

  // Entregáveis: somente gestor ou acima (gestor/admin). Para os demais, oculta o card.
  var podeEntregaveis = (user.role === 'admin' || user.role === 'gestor');
  if(!podeEntregaveis){
    var ce = document.getElementById('card-ent');
    if(ce && ce.parentNode) ce.parentNode.removeChild(ce);
  }

  function sair(){
    localStorage.removeItem('doctrack_token');
    localStorage.removeItem('doctrack_user');
    window.location.href = '/';
  }
  document.getElementById('logout').addEventListener('click', sair);

  function entrar(modulo, url){
    sessionStorage.setItem('dt_module', modulo);
    window.location.href = url;
  }
  function liga(id, modulo, url){
    var el = document.getElementById(id);
    el.addEventListener('click', function(){ entrar(modulo, url); });
    el.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); entrar(modulo, url); }
    });
  }
  liga('card-docs', 'docs', '/');
  if(podeEntregaveis) liga('card-ent', 'ent', '/entregaveis');
})();
</script>
</body>
</html>
