<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocTrack — {{ area.nome }}</title>
<link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/notificacoes-widget.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/hub-vitrine.css?v={{ asset_v }}">
{# Página de <head> próprio: o bloco de PWA entra na mão. #}
{% include "_pwa_head.html" %}
</head>
<body class="hubv" style="--hub-dot:{{ area.accent }}">
<div class="hv-bg" aria-hidden="true"><div class="hv-malha-luz"></div><div class="hv-malha" id="hv-malha"></div></div>

<main class="hv-page">
  <header class="hv-head">
    <div class="hv-brand">DOCTRACK</div>
    <h1>{{ area.nome }}<span class="dot" aria-hidden="true"></span></h1>
    <p class="hv-sub" id="hv-sub">Escolha um módulo</p>
    <div class="hv-status" id="hv-status"><span class="led" aria-hidden="true"></span><span id="hv-status-txt">Carregando…</span></div>
  </header>

  <nav class="hv-rail" aria-label="Módulos de {{ area.nome }}"><ul class="hv-rail-in" id="hv-rail"></ul></nav>

  <div class="hv-stage" id="hv-stage">
    <section class="hv-vitrine" id="hv-vitrine" aria-labelledby="v-name">
      <div class="hv-scene" id="hv-scene" aria-hidden="true">
        <div class="floor"></div><div class="aura"></div>
        <i class="hud tl"></i><i class="hud tr"></i><i class="hud bl"></i><i class="hud br"></i>
      </div>
      <div class="hv-info" id="hv-info">
        <h2><span class="h-ico" id="v-ico" aria-hidden="true"></span><span id="v-name"></span></h2>
        <p class="hv-desc" id="v-desc"></p>
        <div class="hv-stats" id="v-stats"></div>
        <p class="hv-pend" id="v-pend"></p>
        <div class="hv-cta-row">
          <a class="hv-cta" id="v-cta" href="#"><span id="v-cta-txt">Abrir</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <span class="hv-hint" id="v-hint"></span>
        </div>
      </div>
    </section>
  </div>

  <section class="hv-vazio" id="hv-vazio" hidden>
    <div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></svg></div>
    <h2>Nenhum módulo liberado para o seu perfil</h2>
    <p>Fale com um administrador se precisar de acesso.</p>
  </section>
</main>

<footer class="hv-foot foot">
  <a id="back" href="/hub">← Áreas</a>
  <span aria-hidden="true">·</span>
  <a id="theme-toggle" data-label="Tema" onclick="toggleTheme()" title="Alternar tema claro/escuro">🌙 Tema</a>
  <span aria-hidden="true">·</span>
  <a id="logout">Sair</a>
</footer>

<script src="/static/common.js?v={{ asset_v }}"></script>
<script src="/static/auth.js?v={{ asset_v }}"></script>
<script src="/static/notificacoes-widget.js?v={{ asset_v }}"></script>
<script src="/static/hub-vitrine.js?v={{ asset_v }}"></script>
<script>
// Tema em static/common.js (rótulo "Tema" via data-label do botão).
(function(){
  var AREA = {{ area|tojson }};
  var slug = AREA.slug;
  var token = localStorage.getItem('doctrack_token') || '';
  if(!token){ window.location.href = '/'; return; }

  var user = {};
  try { user = JSON.parse(localStorage.getItem('doctrack_user') || '{}') || {}; } catch(e){}
  var isAdmin = user.role === 'admin';
  var isGestor = isAdmin || user.role === 'gestor';
  var isTecnico = isGestor || user.role === 'tecnico';
  var minhas = Array.isArray(user.areas) ? user.areas : [];

  // Sem acesso à área: volta ao hub.
  if(!(isAdmin || minhas.indexOf(slug) !== -1)){ window.location.href = '/hub'; return; }

  var h = new Date().getHours();
  var primeiro = (user.nome || '').split(' ')[0];
  document.getElementById('hv-sub').textContent =
    (h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite') + (primeiro ? ', ' + primeiro : '') + ' · escolha um módulo';

  // Mesmo corte de perfil de antes: role=None todos; "tecnico" técnico pra cima; "gestor" gestão.
  var itens = (AREA.modulos || []).filter(function(m){
    if(m.role === 'gestor') return isGestor;
    if(m.role === 'tecnico') return isTecnico;
    return true;
  }).map(function(m){
    var k = m.module || m.label;
    return { k:k, cor:'m-' + k, nome:m.label, url:m.url, icone:m.icon, cena:k,
             desc:DTHub.DESC_MODULO[k] || '', mod:m.module || '' };
  });

  // Entrar num módulo carrega a área no contexto (telas cientes de área) e o
  // token de módulo que a tela de destino espera (ex.: Documentos exige 'docs').
  var tela = DTHub.iniciar({
    tipo:'mod', itens:itens, chaveUltimo:'dt_hub_ultimo:' + slug, padrao:'docs',
    rotuloCta:function(it){ return 'Abrir ' + it.nome; },
    entrar:function(it, url){
      sessionStorage.setItem('dt_area', slug);
      if(it.mod) sessionStorage.setItem('dt_module', it.mod);
      window.location.href = url;
    },
    dados:function(it, r){
      var d = DTHub.dadosModulo(it.k, slug, r);
      if(!r && !d.pend) d.vazio = 'Carregando…';
      return d;
    }
  });

  // Números da vitrine. Best-effort: falha deixa a tela sem números, nunca
  // atrasa a navegação.
  var st = document.getElementById('hv-status'), stt = document.getElementById('hv-status-txt');
  fetch('/api/hub/resumo', {headers:{'Authorization':'Bearer ' + token}})
    .then(function(res){ if(!res.ok) throw new Error(res.status); return res.json(); })
    .then(function(j){
      tela.atualizar(j);
      var a = new Date();
      st.className = 'hv-status ok';
      stt.textContent = 'Online · atualizado às ' + ('0' + a.getHours()).slice(-2) + ':' + ('0' + a.getMinutes()).slice(-2);
    })
    .catch(function(){
      tela.atualizar({modulos:{}});
      st.className = 'hv-status falha';
      stt.textContent = 'Números indisponíveis agora';
    });

  document.getElementById('logout').addEventListener('click', function(){
    localStorage.removeItem('doctrack_token');
    localStorage.removeItem('doctrack_user');
    window.location.href = '/';
  });
})();
</script>
</body>
</html>
