<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipamentos — DocTrack</title>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/equipamentos.css?v={{ asset_v }}">
</head>
<body>
  <div class="app-shell" style="display:block">
    <main class="main" style="margin:0;max-width:1280px;padding:24px;margin-inline:auto">

      <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
        <div>
          <h1 style="margin:0">Equipamentos</h1>
          <p class="muted" style="margin:4px 0 0">Cadastro de produtos · completude · taxonomia</p>
        </div>
        <div class="page-actions" style="display:flex;gap:10px;align-items:center">
          <button id="theme-toggle" class="btn btn-ghost btn-sm" type="button" onclick="toggleTheme()" title="Alternar tema" style="padding:6px 10px;font-size:14px;line-height:1">🌙</button>
          <a class="btn-modulos" href="/hub/pde"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>Módulos</a>
        </div>
      </div>

      <div class="ent-tabs" role="tablist">
        <button class="ent-tab active" id="tab-btn-dash" role="tab" onclick="trocarAba('dash')">Dashboard</button>
        <button class="ent-tab" id="tab-btn-lista" role="tab" onclick="trocarAba('lista')">Equipamentos</button>
        <button class="ent-tab" id="tab-btn-cat" role="tab" onclick="trocarAba('cat')">Categorias</button>
      </div>

      <!-- ══ Aba Dashboard (completude) ══ -->
      <div id="aba-dash">
        <div class="eq-filters" id="dash-filters"></div>
        <div class="kpi-grid" id="eq-kpis" style="margin-top:16px"></div>
        <div class="eq-grid2" style="margin-top:16px">
          <div class="card">
            <div class="card-title">Distribuição por completude</div>
            <div class="eq-donut-wrap">
              <div class="eq-donut" id="eq-donut"><div class="eq-donut-c"><span class="big" id="eq-donut-avg">—</span><span class="cap">ICE médio</span></div></div>
              <div class="eq-legend" id="eq-donut-legend"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-title">Completude média por dimensão</div>
            <div id="eq-dims"></div>
            <p class="muted" id="eq-dims-note" style="font-size:12px;margin-top:10px"></p>
          </div>
        </div>
        <div class="eq-grid2" style="margin-top:16px">
          <div class="card">
            <div class="card-title">Lacunas mais comuns</div>
            <div id="eq-gaps"></div>
          </div>
          <div class="card">
            <div class="card-title">Menos completos · worklist</div>
            <div id="eq-worklist"></div>
          </div>
        </div>
      </div>

      <!-- ══ Aba Equipamentos (lista + ficha) ══ -->
      <div id="aba-lista" style="display:none">
        <div class="card" style="margin-top:14px">
          <div class="equip-toolbar">
            <div class="filter-bar" style="margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
              <div class="search-wrap">
                <svg width="14" height="14" fill="none" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <input class="search-input" id="eq-busca" placeholder="Buscar nome, SKU, fabricante..." oninput="renderLista()">
              </div>
              <select class="filter-sel" id="eq-f-cat" onchange="renderLista()"><option value="">Categoria: todas</option></select>
              <select class="filter-sel" id="eq-f-status" onchange="renderLista()"><option value="">Status: todos</option></select>
              <label class="muted" style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer"><input type="checkbox" id="eq-f-bloq" onchange="renderLista()"> incluir bloqueados</label>
              <span class="filter-count" id="eq-badge" style="margin-left:auto">—</span>
              <button class="btn btn-ghost btn-sm" onclick="exportarCSV()">Exportar CSV</button>
              <button class="btn btn-ghost btn-sm" id="btn-import" onclick="abrirImport()" style="display:none">Importar planilha</button>
              <button class="btn btn-primary btn-sm" id="btn-novo-eq" onclick="abrirFicha(null)" style="display:none">+ Novo equipamento</button>
            </div>
          </div>
          <div class="equip-grid" id="eq-grid"></div>
        </div>
      </div>

      <!-- ══ Aba Categorias (taxonomia) ══ -->
      <div id="aba-cat" style="display:none">
        <div class="eq-cat-cols" style="margin-top:14px">
          <div class="card">
            <div class="card-title">Categorias</div>
            <div id="cat-list"></div>
            <div class="eq-addline"><input class="form-input" id="cat-new" placeholder="Nova categoria…"><button class="btn btn-primary btn-sm" onclick="addCategoria()">+</button></div>
            <div class="card-title" style="margin-top:22px">Linhas de produto</div>
            <div id="lin-list"></div>
            <div class="eq-addline"><input class="form-input" id="lin-new" placeholder="Nova linha…"><button class="btn btn-primary btn-sm" onclick="addLinha()">+</button></div>
          </div>
          <div class="card" id="cat-detail"></div>
        </div>
      </div>

    </main>
  </div>

  <!-- MODAL: ficha do equipamento -->
  <div class="modal-overlay" id="modal-eq" role="dialog" aria-modal="true" aria-label="Ficha do equipamento" aria-hidden="true">
    <div class="modal" style="width:760px;max-width:96vw" tabindex="-1">
      <div id="eq-ficha-head"></div>
      <div class="equip-modal-tabs" id="eq-ficha-tabs" role="tablist"></div>
      <div id="eq-ficha-panels"></div>
      <div class="modal-footer" style="justify-content:space-between">
        <button class="btn btn-danger btn-sm" id="eq-ficha-del" type="button" onclick="excluirEquip()" style="display:none">Excluir</button>
        <div style="display:flex;gap:8px;margin-left:auto">
          <button class="btn btn-ghost" onclick="closeModal('eq')">Fechar</button>
          <button class="btn btn-primary" id="eq-ficha-save" onclick="salvarFicha()">Salvar alterações</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: importação -->
  <div class="modal-overlay" id="modal-import" role="dialog" aria-modal="true" aria-label="Importar equipamentos" aria-hidden="true">
    <div class="modal" style="width:620px;max-width:96vw" tabindex="-1">
      <div class="modal-title">Importar planilha mestra</div>
      <div class="modal-sub">Casa por SKU de Venda. Veja a prévia antes de aplicar.</div>
      <div class="form-group">
        <label class="form-label">Arquivo (opcional — vazio usa a planilha da rede)</label>
        <input type="file" id="import-file" accept=".xlsx">
      </div>
      <div id="import-preview" class="muted" style="font-size:13px;margin:8px 0">—</div>
      <div class="modal-footer" style="justify-content:space-between">
        <button class="btn btn-ghost btn-sm" onclick="closeModal('import')">Cancelar</button>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost" id="btn-prever" onclick="rodarImport(true)">Pré-visualizar</button>
          <button class="btn btn-primary" id="btn-aplicar" onclick="rodarImport(false)" style="display:none">Aplicar importação</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" style="display:none"></div>
  <script src="/static/equipamentos.js?v={{ asset_v }}"></script>
</body>
</html>
