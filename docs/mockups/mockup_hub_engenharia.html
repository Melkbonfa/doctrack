<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub Engenharia — protótipo</title>
<!--
  Protótipo isolado do sub-hub de P&D Equipamentos (/hub/pde), a partir do
  mockup "P&D Biotecnologia". Arquivo único e SEM dependências externas (nada
  de Tailwind/Three.js por CDN): a rede da fábrica não garante saída para a
  internet — mesmo motivo de o style.css ter abandonado o Google Fonts.

  - Tokens de cor/fonte copiados de static/style.css (escuro + body.theme-light).
  - Módulos, rotas, papéis e ícones copiados de areas.py.
  - Cenas animadas em SVG + CSS puro; só a cena visível anima.
  - Passar o mouse só acende o módulo; o clique troca a vitrine; clicar de novo
    (ou duplo clique) abre. A vitrine inclina sob o mouse, com peso de mola.
  - Números são de exemplo. O painel "Protótipo" (canto inferior esquerdo)
    troca perfil, tema, animação e pendências, e diz de onde cada número viria
    na implementação real.
-->
<style>
:root{
  /* ── de static/style.css ── */
  --bg-void:#15172e; --bg-base:#1a1d3a; --bg-card:#1f2444; --bg-elevated:#2a2f54; --bg-hover:#2f3560;
  --border-dim:rgba(34,211,238,.10); --border-soft:rgba(34,211,238,.18);
  --border-mid:rgba(34,211,238,.30); --border-hi:rgba(34,211,238,.55);
  --t1:#f1f5f9; --t2:#c7d2fe; --t3:#94a3ff; --t4:#7884c9;
  --green:#10b981; --red:#f43f5e;
  --font-body:'Inter','Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace;
  --focus-ring:0 0 0 3px rgba(6,182,212,.45);

  /* ── do hub ── */
  --accent:#22d3ee;            /* area.accent de "pde" */
  --accent-ink:#22d3ee;        /* acento usado como cor de texto */
  --red-ink:#fb7185;
  --page-glow:rgba(34,211,238,.11);
  --card-bg:rgba(31,36,68,.62);
  --card-bg-hi:rgba(42,47,84,.92);
  --panel-bg:rgba(26,29,58,.80);
  --scene-bg:#10132b;
  --scene-paper:#181d40;
  --grid:rgba(34,211,238,.06);
  --grid-floor:rgba(34,211,238,.17);
  --tile-bg:rgba(15,17,41,.45);
  --track:rgba(148,163,255,.14);
  --on-m:#08122b;              /* texto sobre a cor do módulo */
  --shadow-c:rgba(0,0,0,.62);
  --mesh:rgba(148,163,255,.075);       /* malha côncava: linha fina */
  --mesh-major:rgba(34,211,238,.11);   /* malha côncava: linha a cada 5 */
  --malha-luz:rgba(34,211,238,.045);
  --shadow-float:0 12px 32px rgba(0,0,0,.38);
}
body.theme-light{
  --bg-void:#eef1f8; --bg-base:#f4f6fb; --bg-card:#fff; --bg-elevated:#ffffff; --bg-hover:#e7ecf7;
  --border-dim:rgba(30,41,99,.10); --border-soft:rgba(30,41,99,.16);
  --border-mid:rgba(30,41,99,.26); --border-hi:rgba(30,41,99,.40);
  --t1:#1a1f3a; --t2:#384063; --t3:#5b6488; --t4:#8189ad;
  --accent:#0891b2; --accent-ink:#0e7490; --red:#e11d48; --red-ink:#be123c;
  --page-glow:rgba(8,145,178,.10);
  --card-bg:rgba(255,255,255,.88); --card-bg-hi:#fff;
  --panel-bg:rgba(255,255,255,.92);
  --scene-bg:#f2f7fc; --scene-paper:#ffffff;
  --grid:rgba(8,145,178,.08); --grid-floor:rgba(8,145,178,.20);
  --tile-bg:#f5f7fc; --track:rgba(30,41,99,.10);
  --on-m:#ffffff;
  --shadow-c:rgba(30,41,99,.28);
  --mesh:rgba(30,41,99,.07); --mesh-major:rgba(8,145,178,.13); --malha-luz:rgba(8,145,178,.05);
  --shadow-float:0 10px 26px rgba(30,41,99,.16);
}

/* Cor de cada módulo: mesma família fria do acento da área, só para
   diferenciar as cenas. No tema claro, versões escuras (contraste em branco). */
.m-equip  {--m:#22d3ee;--m-rgb:34,211,238;--m-ink:#67e8f9}
.m-docs   {--m:#38bdf8;--m-rgb:56,189,248;--m-ink:#7dd3fc}
.m-proj   {--m:#60a5fa;--m-rgb:96,165,250;--m-ink:#93c5fd}
.m-missoes{--m:#2dd4bf;--m-rgb:45,212,191;--m-ink:#5eead4}
.m-custos {--m:#34d399;--m-rgb:52,211,153;--m-ink:#6ee7b7}
.m-tempos {--m:#818cf8;--m-rgb:129,140,248;--m-ink:#a5b4fc}
.m-fluxos {--m:#06b6d4;--m-rgb:6,182,212;--m-ink:#67e8f9}
.theme-light .m-equip  {--m:#0891b2;--m-rgb:8,145,178;--m-ink:#0e7490}
.theme-light .m-docs   {--m:#0284c7;--m-rgb:2,132,199;--m-ink:#0369a1}
.theme-light .m-proj   {--m:#2563eb;--m-rgb:37,99,235;--m-ink:#1d4ed8}
.theme-light .m-missoes{--m:#0d9488;--m-rgb:13,148,136;--m-ink:#0f766e}
.theme-light .m-custos {--m:#059669;--m-rgb:5,150,105;--m-ink:#047857}
.theme-light .m-tempos {--m:#4f46e5;--m-rgb:79,70,229;--m-ink:#4338ca}
.theme-light .m-fluxos {--m:#0e7490;--m-rgb:14,116,144;--m-ink:#155e75}

*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background-color:var(--bg-void);
  background-image:radial-gradient(ellipse 75% 55% at 50% -12%,var(--page-glow),transparent 70%);
  color:var(--t1);font-family:var(--font-body);-webkit-font-smoothing:antialiased;
  transition:background-color .2s,color .2s;
  --mx:0;--my:0;               /* posição do mouse na página (paralaxe da malha) */
}
button{font:inherit;color:inherit}

/* ── Malha côncava de fundo ──────────────────────────────────────────────
   Grade fina com distorção em almofada: as linhas se curvam para dentro,
   como o fundo de uma tigela — mais fechada no centro (o ponto mais fundo),
   mais aberta nas bordas, e apagando perto delas. O SVG é gerado pelo JS (e
   refeito ao redimensionar a janela); desliza poucos pixels com o mouse. */
.bg-mesh{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.malha{
  position:absolute;inset:-24px;
  translate:calc(var(--mx) * -14px) calc(var(--my) * -10px);
  -webkit-mask-image:radial-gradient(ellipse 80% 76% at 50% 48%,#000 45%,transparent 100%);
  mask-image:radial-gradient(ellipse 80% 76% at 50% 48%,#000 45%,transparent 100%);
}
.malha svg{display:block}
.malha .ml{fill:none;stroke:var(--mesh);stroke-width:1}
.malha .ml.forte{stroke:var(--mesh-major)}
/* Luz suave no fundo da "tigela". */
.malha-luz{position:absolute;inset:0;background:radial-gradient(ellipse 50% 46% at 50% 48%,var(--malha-luz),transparent 72%)}
a{color:inherit}

.page{
  flex:1;width:100%;max-width:1080px;margin:0 auto;
  display:flex;flex-direction:column;justify-content:center;
  gap:clamp(14px,2.4vh,26px);padding:clamp(16px,3vh,30px) 20px 10px;
}

/* ── Cabeçalho ───────────────────────────────────────────────────────── */
.head{text-align:center}
.brand{font-size:12px;font-weight:700;letter-spacing:.3em;color:var(--accent-ink);margin-bottom:8px}
.head h1{position:relative;display:inline-block;margin:0;font-size:clamp(26px,3.1vw,34px);font-weight:750;letter-spacing:-.8px;line-height:1.1}
/* Ponto fora do fluxo: o título fica centrado de verdade. Estático — o
   "ping" infinito do mockup puxava o olho o tempo todo. */
.head h1 .dot{position:absolute;right:-17px;top:50%;width:9px;height:9px;margin-top:-3px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.sub{margin:6px 0 0;color:var(--t2);font-size:14.5px}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:9px;padding:3px 11px;border-radius:999px;border:1px solid var(--border-dim);font:500 11px/16px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.status .led{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}

/* ── Fileira de módulos ──────────────────────────────────────────────── */
/* Rola na horizontal quando não cabe, começando da esquerda (o mockup usava
   justify-center + overflow e cortava os primeiros cartões sem deixar rolar). */
.rail{overflow-x:auto;scrollbar-width:none;padding:4px 4px 14px;margin:0 -4px}
.rail::-webkit-scrollbar{display:none}
.rail-in{display:flex;gap:12px;width:max-content;margin:0 auto;padding:0;list-style:none}
.rail-in>li{display:flex}
.mod{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  width:112px;height:100px;padding:10px 6px;border-radius:16px;
  background:var(--card-bg);border:1px solid var(--border-soft);color:var(--t2);text-decoration:none;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .2s,background-color .2s,box-shadow .25s,color .2s;
  -webkit-tap-highlight-color:transparent;
}
.theme-light .mod{box-shadow:0 1px 2px rgba(30,41,99,.06)}
.mod .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tile-bg);border:1px solid var(--border-dim);color:var(--m-ink);transition:box-shadow .25s,border-color .25s}
.mod .ico svg{width:24px;height:24px;transition:transform .25s cubic-bezier(.2,.8,.2,1),filter .25s}
.mod .lbl{font-size:13px;font-weight:500;line-height:1.1;white-space:nowrap}
/* Passar o mouse (ou o foco do teclado) só ACENDE o cartão; quem troca a
   vitrine é o clique. */
.mod:hover,.mod:focus-visible{transform:translateY(-2px);color:var(--t1);border-color:rgba(var(--m-rgb),.75);box-shadow:inset 0 0 0 1px rgba(var(--m-rgb),.30),0 0 24px -6px rgba(var(--m-rgb),.60)}
.mod:hover .ico,.mod:focus-visible .ico{border-color:rgba(var(--m-rgb),.5);box-shadow:0 0 16px -3px rgba(var(--m-rgb),.65)}
.mod:hover .ico svg,.mod:focus-visible .ico svg{transform:scale(1.08);filter:drop-shadow(0 0 4px rgba(var(--m-rgb),.75))}
.mod.sel{
  transform:translateY(-3px);color:var(--t1);border-color:var(--m);
  background:linear-gradient(180deg,rgba(var(--m-rgb),.18),var(--card-bg-hi) 72%);
  box-shadow:inset 0 0 0 1px var(--m),0 14px 34px -14px rgba(var(--m-rgb),.55);
}
.mod.sel .lbl{font-weight:650}
.mod.sel .ico{border-color:rgba(var(--m-rgb),.5);box-shadow:0 0 18px -3px rgba(var(--m-rgb),.6)}
/* Traço sob o cartão selecionado: liga o cartão à vitrine logo abaixo. */
.mod.sel::after{content:'';position:absolute;left:50%;bottom:-11px;width:26px;height:3px;border-radius:3px;background:var(--m);transform:translateX(-50%);box-shadow:0 0 10px var(--m)}
.mod:focus-visible{outline:none;box-shadow:var(--focus-ring),0 0 24px -6px rgba(var(--m-rgb),.6)}
.mod.sel:focus-visible{box-shadow:inset 0 0 0 1px var(--m),var(--focus-ring)}
.mod.go{animation:go .32s ease}
@keyframes go{40%{transform:translateY(-1px) scale(.96)}}
.badge{position:absolute;top:7px;right:7px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;font-size:11px;font-weight:700;line-height:18px;text-align:center;background:rgba(var(--m-rgb),.16);color:var(--m-ink);border:1px solid rgba(var(--m-rgb),.45)}
.badge.alerta{background:var(--red);color:#fff;border-color:transparent}

/* ── Vitrine (painel do módulo) ──────────────────────────────────────── */
/* --px/--py (-0,5 a 0,5) = onde o mouse está sobre a vitrine, já suavizado
   pela mola em JS (ficam no #stage e descem por herança). Movem a
   inclinação, a sombra, a luz de fundo e as camadas da cena. */
.vitrine{
  position:relative;transition:border-color .35s;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:24px;
  padding:18px;border-radius:22px;background:var(--panel-bg);
  border:1px solid rgba(var(--m-rgb),.28);overflow:hidden;transform-origin:50% 50%;
  box-shadow:calc(var(--px) * -44px) calc(30px + var(--py) * -28px) 80px -32px var(--shadow-c);
}
/* Brilho que acompanha o mouse enquanto ele pesa sobre a vitrine. */
.vitrine::after{content:'';position:absolute;inset:0;z-index:2;border-radius:inherit;pointer-events:none;background:radial-gradient(460px circle at var(--gx,50%) var(--gy,50%),rgba(var(--m-rgb),.13),transparent 62%);opacity:0;transition:opacity .45s}
.theme-light .vitrine::after{background:radial-gradient(460px circle at var(--gx,50%) var(--gy,50%),rgba(var(--m-rgb),.08),transparent 62%)}
.vitrine.pesando::after{opacity:1}

/* Retroiluminação: com o mouse em cima, a vitrine acende como os módulos —
   borda, moldura da cena e cantos na cor do módulo, e uma luz POR TRÁS do
   painel que vaza pelas bordas e transparece no vidro. Por estar atrás, a
   luz desliza ao contrário da inclinação. */
.stage{--px:0;--py:0;position:relative;isolation:isolate}
.stage::before{
  content:'';position:absolute;inset:10px;z-index:-1;border-radius:22px;pointer-events:none;
  box-shadow:0 0 70px 10px rgba(var(--m-rgb),.20),0 0 26px 2px rgba(var(--m-rgb),.20);
  opacity:0;transition:opacity .4s ease;will-change:opacity,translate;
  translate:calc(var(--px) * -18px) calc(var(--py) * -14px);
}
.theme-light .stage::before{box-shadow:0 0 60px 8px rgba(var(--m-rgb),.14),0 0 22px 2px rgba(var(--m-rgb),.12)}
@media (hover:hover){
  .stage:hover::before{opacity:1}
  .stage:hover .vitrine{border-color:rgba(var(--m-rgb),.75)}
  .stage:hover .scene{border-color:rgba(var(--m-rgb),.45)}
  .stage:hover .scene .hud{border-color:var(--m)}
}
.vitrine::before{content:'';position:absolute;top:-100px;left:50%;width:560px;height:190px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(var(--m-rgb),.20),transparent);pointer-events:none}

.scene{position:relative;min-height:236px;border-radius:14px;overflow:hidden;isolation:isolate;background:var(--scene-bg);border:1px solid rgba(var(--m-rgb),.20);transition:border-color .35s}
.scene::before{content:'';position:absolute;inset:0;z-index:-1;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.scene .floor{position:absolute;left:-30%;right:-30%;bottom:-38%;height:70%;z-index:-1;background-image:linear-gradient(var(--grid-floor) 1px,transparent 1px),linear-gradient(90deg,var(--grid-floor) 1px,transparent 1px);background-size:34px 34px;transform:perspective(380px) rotateX(64deg);transform-origin:50% 0;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 55%);mask-image:linear-gradient(to bottom,transparent,#000 55%)}
.scene .aura{position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 52%,rgba(var(--m-rgb),.16),transparent 62%)}
.scene .hud{position:absolute;width:14px;height:14px;border:0 solid rgba(var(--m-rgb),.55);transition:border-color .35s}
.scene .hud.tl{top:10px;left:10px;border-top-width:1.5px;border-left-width:1.5px;border-top-left-radius:4px}
.scene .hud.tr{top:10px;right:10px;border-top-width:1.5px;border-right-width:1.5px;border-top-right-radius:4px}
.scene .hud.bl{bottom:10px;left:10px;border-bottom-width:1.5px;border-left-width:1.5px;border-bottom-left-radius:4px}
.scene .hud.br{bottom:10px;right:10px;border-bottom-width:1.5px;border-right-width:1.5px;border-bottom-right-radius:4px}

/* Profundidade dentro da cena: ao inclinar, piso, desenho e brilho deslizam
   em velocidades diferentes (propriedade `translate`, que não briga com as
   animações de `transform`). */
.scene .floor{translate:calc(var(--px) * -26px) calc(var(--py) * -12px)}
.scene .aura{translate:calc(var(--px) * 34px) calc(var(--py) * 22px)}
.scn{position:absolute;inset:0;width:100%;height:100%;display:none;overflow:visible;translate:calc(var(--px) * 12px) calc(var(--py) * 8px)}
.scn.on{display:block;animation:scnIn .45s ease both}
@keyframes scnIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

/* elementos das cenas */
.scn .ln{fill:none;stroke:var(--m);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.scn .pap{fill:var(--scene-paper)}
.scn .acc{fill:var(--m)}
.scn .sft{fill:rgba(var(--m-rgb),.16)}
.scn .sft2{fill:rgba(var(--m-rgb),.30)}
.scn .trk{fill:var(--track)}
.scn .col{fill:rgba(var(--m-rgb),.05);stroke-opacity:.24}
.scn .dim{opacity:.38}
.scn .dim2{stroke-opacity:.45}
.scn .tx{fill:var(--t3);font:600 10px var(--font-mono);letter-spacing:.08em}
.scn .tx-a{fill:var(--m-ink)}
.scn .tx-d{fill:var(--t4);font-weight:500;letter-spacing:.02em}
.scn .tx-ink{fill:var(--on-m);font:700 9px var(--font-mono);letter-spacing:.1em}

/* animações das cenas (estado-base = quadro estático que faz sentido sem animação) */
.pulse{fill:none;stroke:var(--m);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:7 100;stroke-dashoffset:7;animation:pulse var(--t) linear var(--d) infinite backwards}
@keyframes pulse{from{stroke-dashoffset:7}to{stroke-dashoffset:-100}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.core{fill:rgba(var(--m-rgb),.14);animation:core 2.4s ease-in-out infinite}
@keyframes core{50%{fill:rgba(var(--m-rgb),.38)}}
.flt{animation:flt var(--fd) ease-in-out var(--fdl) infinite}
@keyframes flt{50%{transform:translateY(-7px)}}
.scan{animation:scan 3.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes scan{0%{transform:translateY(0)}70%,100%{transform:translateY(176px)}}
.stamp{transform-box:fill-box;transform-origin:center;animation:stamp 3.4s ease infinite}
@keyframes stamp{0%,66%{transform:scale(.4);opacity:0}74%{transform:scale(1.15);opacity:1}80%,94%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.pt{opacity:0;animation:pt 4.2s ease-out var(--d) infinite}
@keyframes pt{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-70px);opacity:0}}
.gf{transform-box:fill-box;transform-origin:left center;transform:scaleX(var(--p));opacity:.85;animation:gf 6.5s cubic-bezier(.3,.7,.2,1) var(--dl) infinite backwards}
@keyframes gf{0%{transform:scaleX(0);opacity:.85}45%,88%{transform:scaleX(var(--p));opacity:.85}100%{transform:scaleX(var(--p));opacity:0}}
.ms{fill:var(--m);transform-box:fill-box;transform-origin:center;animation:ms 6.5s ease infinite backwards}
@keyframes ms{0%,40%{transform:scale(0)}50%{transform:scale(1.35)}58%,90%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.mv{transform-box:fill-box;transform-origin:center;transform:translate(120px,-36px);animation:mv 8s cubic-bezier(.5,0,.3,1) infinite}
@keyframes mv{0%{transform:translate(0,0);opacity:0}8%,20%{transform:translate(0,0);opacity:1}27%{transform:translate(60px,-22px) scale(1.07)}34%,58%{transform:translate(120px,-36px)}65%{transform:translate(180px,-14px) scale(1.07)}72%,92%{transform:translate(240px,0);opacity:1}100%{transform:translate(240px,0);opacity:0}}
.cb{transform-box:fill-box;transform-origin:center bottom;animation:cb 7s cubic-bezier(.3,.7,.2,1) calc(var(--i) * 70ms) infinite backwards}
@keyframes cb{0%{transform:scaleY(0)}32%,90%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.trend{stroke-width:2.2;stroke-dasharray:100;stroke-dashoffset:0;animation:trend 7s ease infinite}
@keyframes trend{0%,32%{stroke-dashoffset:100}58%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.dotp{transform-box:fill-box;transform-origin:center;animation:dotp 1.6s ease-in-out infinite}
@keyframes dotp{50%{transform:scale(1.7);opacity:.55}}
.arc{stroke-width:3;stroke-dasharray:72 100;animation:arc 6s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes arc{0%{stroke-dasharray:0 100}50%,92%{stroke-dasharray:72 100;opacity:1}100%{stroke-dasharray:72 100;opacity:0}}
.hand{transform-origin:148px 118px;animation:spin 9s linear infinite}
.tf{transform-box:fill-box;transform-origin:left center;animation:tf 6s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes tf{0%{transform:scaleX(.2)}60%,100%{transform:scaleX(1)}}
.flow{stroke-dasharray:3 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.tok{transform:translateX(224px);animation:tok 8s cubic-bezier(.55,0,.3,1) infinite}
@keyframes tok{0%{transform:translateX(0);opacity:0}5%,12%{transform:translateX(0);opacity:1}25%,37%{transform:translateX(112px)}50%,62%{transform:translateX(224px)}75%,92%{transform:translateX(336px);opacity:1}100%{transform:translateX(336px);opacity:0}}
.lit{opacity:0}
.lit.n1,.lit.n2,.lit.n3{opacity:1}
.lit.n1{animation:nl1 8s infinite}.lit.n2{animation:nl2 8s infinite}
.lit.n3{animation:nl3 8s infinite}.lit.n4{animation:nl4 8s infinite}
@keyframes nl1{0%,4%{opacity:0}6%,96%{opacity:1}100%{opacity:0}}
@keyframes nl2{0%,24%{opacity:0}26%,96%{opacity:1}100%{opacity:0}}
@keyframes nl3{0%,49%{opacity:0}51%,96%{opacity:1}100%{opacity:0}}
@keyframes nl4{0%,74%{opacity:0}76%,96%{opacity:1}100%{opacity:0}}

/* info */
.info{position:relative;display:flex;flex-direction:column;justify-content:center;gap:12px;min-width:0}
.info.swap{animation:infoIn .3s ease both}
@keyframes infoIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.info h2{display:flex;align-items:center;gap:11px;margin:0;font-size:24px;font-weight:700;letter-spacing:-.4px}
.h-ico{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(var(--m-rgb),.12);border:1px solid rgba(var(--m-rgb),.38);color:var(--m-ink)}
.h-ico svg{width:20px;height:20px}
.desc{margin:0;color:var(--t2);font-size:14px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{min-width:0;padding:10px 12px;border-radius:12px;background:var(--tile-bg);border:1px solid var(--border-dim)}
.stat .v{display:block;font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v u{text-decoration:none;font-size:.6em;font-weight:600;color:var(--t3);margin:0 2px}
.stat .v.hl{color:var(--m-ink)}
.stat .v.alerta{color:var(--red-ink)}
.stat .l{display:block;margin-top:3px;font-size:12px;line-height:1.3;color:var(--t3)}
.stat .bar{display:block;margin-top:8px;height:4px;border-radius:4px;background:var(--track);overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,rgba(var(--m-rgb),.55),var(--m));animation:barIn .7s cubic-bezier(.3,.7,.2,1) both}
@keyframes barIn{from{width:0}}
.pend{display:flex;align-items:center;gap:9px;margin:0;font-size:13.5px;color:var(--t2)}
.pend b{color:var(--t1);font-weight:650}
.pend .led{flex:none;width:8px;height:8px;border-radius:50%;background:var(--m);box-shadow:0 0 8px var(--m)}
.pend.alerta .led{background:var(--red);box-shadow:0 0 8px var(--red)}
.pend.alerta b{color:var(--red-ink)}
.pend.neutro .led{background:var(--t4);box-shadow:none}
.pend.vazio{color:var(--t3)}
.pend.vazio .led{background:transparent;box-shadow:inset 0 0 0 1.5px var(--t4)}
.cta-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:2px}
.cta{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;background:linear-gradient(135deg,var(--m),#3b82f6);color:var(--on-m);font-size:14px;font-weight:700;text-decoration:none;box-shadow:0 10px 26px -12px rgba(var(--m-rgb),.75);transition:transform .15s,filter .2s}
.theme-light .cta{background:linear-gradient(135deg,var(--m-ink),#1e40af)}
.cta:hover{transform:translateY(-1px);filter:brightness(1.07)}
.cta:active{transform:scale(.98)}
.cta:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.cta svg{width:16px;height:16px;transition:transform .2s}
.cta:hover svg{transform:translateX(3px)}
.hint{font-size:12px;color:var(--t3)}
.hint kbd{display:inline-block;min-width:20px;padding:1px 5px;border-radius:5px;border:1px solid var(--border-mid);background:var(--tile-bg);font:600 10.5px/16px var(--font-mono);color:var(--t2);text-align:center}

/* ── Rodapé, sino, toast ─────────────────────────────────────────────── */
.foot{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 16px 14px;font-size:13px;color:var(--t4)}
.foot a,.foot button{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:0;border-radius:8px;background:none;color:var(--accent-ink);text-decoration:none;cursor:pointer;font-weight:500}
.foot a:hover,.foot button:hover{background:rgba(var(--m-rgb,34,211,238),.10)}
.foot a:focus-visible,.foot button:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.foot svg{width:15px;height:15px}

/* Mesmo visual do sino real (static/notificacoes-widget.css): contador
   vermelho só quando há algo novo, em vez de um ponto piscando sempre. */
.sino{position:fixed;right:24px;bottom:24px;z-index:40;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--bg-elevated);border:1px solid var(--border-soft);color:var(--t3);box-shadow:var(--shadow-float);cursor:pointer;transition:color .15s,border-color .15s}
.sino:hover,.sino.tem{color:var(--t1);border-color:var(--accent)}
.sino:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.sino svg{width:20px;height:20px}
.sino-badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font:600 11px/19px var(--font-body);text-align:center;box-shadow:0 0 0 2px var(--bg-void)}
.sino-badge[hidden]{display:none}

.toast{position:fixed;left:50%;bottom:26px;z-index:60;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:12px;background:var(--bg-elevated);border:1px solid var(--border-mid);color:var(--t1);font-size:13px;box-shadow:var(--shadow-float);opacity:0;transform:translate(-50%,16px);transition:opacity .22s,transform .22s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{font-family:var(--font-mono);font-weight:600;color:var(--accent-ink)}

/* ── Painel de teste do protótipo (não faz parte do design) ──────────── */
.lab{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:12px;color:var(--t2)}
.lab-tg{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:999px;border:1px dashed var(--border-hi);background:var(--bg-elevated);color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-float)}
.lab-tg svg{width:14px;height:14px}
.lab-body{display:none;width:292px;max-height:calc(100vh - 80px);overflow:auto;padding:12px 12px 10px;border-radius:14px;border:1px dashed var(--border-hi);background:var(--bg-elevated);box-shadow:var(--shadow-float)}
.lab[data-open="true"] .lab-body{display:block}
.lab-row{display:grid;gap:5px;margin-bottom:10px}
.lab-row>span{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
.seg{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--bg-void);border:1px solid var(--border-dim)}
.seg button{flex:1;height:26px;padding:0 6px;border:0;border-radius:6px;background:transparent;color:var(--t3);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--t1)}
.seg button[aria-pressed="true"]{background:var(--bg-card);color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.theme-light .seg button[aria-pressed="true"]{box-shadow:0 1px 3px rgba(30,41,99,.18)}
.lab-src{margin:2px 0 0;padding-top:9px;border-top:1px solid var(--border-dim);font:11px/1.5 var(--font-mono);color:var(--t3)}
.lab-src strong{display:block;margin-bottom:2px;font-family:var(--font-body);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}

/* ── Estados globais ─────────────────────────────────────────────────── */
body.motion-off *,body.motion-off *::before,body.motion-off *::after{animation:none !important;transition:none !important}
body.motion-off .scan,body.motion-off .pt{display:none}
body.paused .scene *,body.paused .bg-mesh *{animation-play-state:paused !important}

/* ── Responsivo ──────────────────────────────────────────────────────── */
@media (min-width:1500px) and (min-height:900px){
  .page{max-width:1160px}
  .mod{width:120px;height:108px}
  .scene{min-height:280px}
}
@media (max-height:700px) and (min-width:901px){
  .page{gap:14px;padding-top:14px}
  .status{display:none}
  .scene{min-height:220px}
}
@media (max-width:900px){
  .vitrine{grid-template-columns:1fr;gap:16px;padding:14px}
  .scene{min-height:0;height:200px}
  .rail-in{gap:10px}
  .mod{width:92px;height:92px}
}
/* Abaixo disso os 7 não cabem numa fileira: quebra em grade de 4 colunas
   (rolagem horizontal escondida faria o último módulo "sumir"). */
@media (max-width:760px){
  .rail{overflow:visible;padding:2px 0 10px;margin:0}
  .rail-in{width:auto;flex-wrap:wrap;justify-content:center;gap:8px}

  .mod{width:100%;height:84px;gap:6px;padding:8px 2px;border-radius:14px}
  .mod .ico{width:36px;height:36px;border-radius:10px}
  .mod .ico svg{width:20px;height:20px}
  .mod .lbl{font-size:11.5px}
  .mod.sel::after{bottom:-6px;width:20px}
  .badge{top:4px;right:4px;min-width:18px;height:18px;line-height:16px;font-size:10.5px;padding:0 5px}
}
@media (max-width:640px){
  .page{justify-content:flex-start;gap:16px;padding:18px 16px 8px}
  .status{display:none}
  .scene{height:150px}
  .scn .tx{display:none}   /* decorativo: a 0,6x de escala vira ruído */
  .info{gap:11px}
  .info h2{font-size:20px}
  .stats{gap:8px}
  .stat{padding:8px 9px}
  .stat .v{font-size:18px}
  .stat .l{font-size:11px}
  .cta{flex:1;justify-content:center}
  .hint{display:none}
  .sino{right:16px;bottom:16px;width:44px;height:44px}
  .foot{padding-bottom:70px}  /* espaço para o sino e o botão do protótipo */
}
@media (max-width:359px){ .rail-in>li{width:calc((100% - 16px) / 3)} }

};
var state = {
  perfil: 'gestor',
  tema: ls.get('doctrack_theme') === 'light' ? 'claro' : 'escuro',
  anim: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduzida' : 'ligada',
  pend: 'com',
  sel: null
};
var ULTIMO = 'dt_hub_ultimo:pde';

function mod(k){ for(var i = 0; i < MODS.length; i++) if(MODS[i].k === k) return MODS[i]; return null; }
function visiveis(){ return MODS.filter(function(m){ return VIS[state.perfil](m.role); }); }
function pendDe(m){ if(!m.pend) return null; if(state.pend === 'sem' && !m.pend.neutro) return null; return m.pend; }
function semTags(h){ return h.replace(/<[^>]+>/g, ''); }

/* ── Malha abaulada: uma grade quadrada em pixels de tela passa por uma
   curvatura só horizontal  x' = x · (1 + K · u²) / (1 + K)  (u = x ÷ meia
   largura); y fica igual. As verticais se juntam no meio e abrem para as
   laterais; topo e base não dobram.
   K = quanto curva; PASSO = tamanho da célula sem distorção. ─────────── */
var malha = $('#malha');
var K_MALHA = 0, PASSO_MALHA = 20, PONTOS = 48;
function desenhaMalha(){
  var w = malha.clientWidth, h = malha.clientHeight;
  var cx = w / 2, cy = h * 0.48, R = Math.sqrt(cx * cx + Math.pow(Math.max(cy, h - cy), 2));
  var n = Math.ceil(R / PASSO_MALHA), lim = n * PASSO_MALHA, out = '';
  function ponto(x, y){
    /* Curva só no eixo horizontal (como um painel curvo): as linhas
       horizontais ficam retas e só o espaçamento das verticais muda —
       mais juntas no meio, abrindo para as laterais. K negativo inverte. */
    var u = x / cx, s = (1 + K_MALHA * u * u) / (1 + K_MALHA);
    return (cx + x * s).toFixed(1) + ' ' + (cy + y).toFixed(1);
  }
  for(var i = -n; i <= n; i++){
    var c = i * PASSO_MALHA, dv = '', dh = '';
    for(var j = 0; j <= PONTOS; j++){
      var t = -lim + 2 * lim * j / PONTOS, cmd = j ? ' L' : 'M';
      dv += cmd + ponto(c, t);   /* linha vertical x = c   */
      dh += cmd + ponto(t, c);   /* linha horizontal y = c */
    }
    var cls = 'ml' + (i % 5 === 0 ? ' forte' : '');
    out += '<path class="' + cls + '" d="' + dv + '"/><path class="' + cls + '" d="' + dh + '"/>';
  }
  malha.innerHTML = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" focusable="false">' + out + '</svg>';
}
desenhaMalha();
var tmMalha;
window.addEventListener('resize', function(){ clearTimeout(tmMalha); tmMalha = setTimeout(desenhaMalha, 150); });

/* ── Render ────────────────────────────────────────────────────────────── */
sceneBox.insertAdjacentHTML('beforeend', MODS.map(function(m){
  return '<svg class="scn m-' + m.k + '" data-scn="' + m.k + '" viewBox="0 0 480 240" preserveAspectRatio="xMidYMid meet" focusable="false">' + SCN[m.k]() + '</svg>';
}).join(''));

function renderRail(){
  var vis = visiveis();
  rail.innerHTML = vis.map(function(m){
    var p = pendDe(m), tem = p && p.n;
    return '<li><a class="mod m-' + m.k + '" href="' + m.url + '" data-k="' + m.k + '" aria-label="' + m.label + (tem ? ', ' + semTags(p.txt) : '') + '">' +
      '<span class="ico" aria-hidden="true">' + svg(IC[m.k]) + '</span><span class="lbl">' + m.label + '</span>' +
      (tem ? '<span class="badge' + (p.alerta ? ' alerta' : '') + '" aria-hidden="true">' + p.n + '</span>' : '') + '</a></li>';
  }).join('');
  var fica = vis.some(function(m){ return m.k === state.sel; });
  select(fica ? state.sel : padrao(vis), true);
}

function padrao(vis){
  var ult = ls.get(ULTIMO);
  if(ult && vis.some(function(m){ return m.k === ult; })) return ult;
  var d = vis.filter(function(m){ return m.k === 'docs'; })[0];
  return (d || vis[0]).k;
}

function statHTML(s){
  var zera = state.pend === 'sem' && (s.hl || s.alerta);
  var cls = 'v' + (s.alerta && !zera ? ' alerta' : '') + (s.hl && !zera ? ' hl' : '');
  return '<div class="stat"><span class="' + cls + '">' + (zera ? '0' : s.v) + '</span><span class="l">' + s.l + '</span>' +
    (s.p != null ? '<span class="bar"><i style="width:' + s.p + '%"></i></span>' : '') + '</div>';
}

function select(k, forcar){
  if(!forcar && k === state.sel) return;
  var m = mod(k); if(!m) return;
  state.sel = k;
  rail.querySelectorAll('.mod').forEach(function(a){ a.classList.toggle('sel', a.dataset.k === k); });
  vit.className = 'vitrine m-' + k + (vit.classList.contains('pesando') ? ' pesando' : '');
  vit.parentNode.className = 'stage m-' + k;   /* a luz de fundo usa a cor do módulo */
  sceneBox.querySelectorAll('.scn').forEach(function(s){ s.classList.toggle('on', s.dataset.scn === k); });
  $('#v-ico').innerHTML = svg(IC[k], 1.8);
  $('#v-name').textContent = m.label;
  $('#v-desc').textContent = m.desc;
  $('#v-stats').innerHTML = m.stats.map(statHTML).join('');
  var p = pendDe(m), pe = $('#v-pend');
  pe.className = 'pend' + (!p ? ' vazio' : p.alerta ? ' alerta' : p.neutro ? ' neutro' : '');
  pe.innerHTML = '<span class="led" aria-hidden="true"></span><span>' + (p ? p.txt : 'Nada esperando por você aqui.') + '</span>';
  $('#v-cta-txt').textContent = 'Abrir ' + m.label;
  $('#v-cta').setAttribute('href', m.url);
  $('#lab-src').textContent = m.src;
  if(!forcar){ info.classList.remove('swap'); void info.offsetWidth; info.classList.add('swap'); }
}

function abrir(k){
  var m = mod(k); if(!m) return;
  ls.set(ULTIMO, k);
  var a = rail.querySelector('.mod[data-k="' + k + '"]');
  if(a){ a.classList.remove('go'); void a.offsetWidth; a.classList.add('go'); }
  toast('Protótipo: aqui abriria <b>' + m.url + '</b>');
}

function atualizaDica(){
  $('#hint').textContent = fine ? 'ou clique duas vezes no módulo' : 'ou toque de novo no módulo';
}

function atualizaSino(){
  var com = state.pend === 'com';
  $('#sino-badge').hidden = !com;
  $('#sino').classList.toggle('tem', com);
  $('#sino').setAttribute('aria-label', com ? 'Notificações, 3 novas' : 'Notificações');
}

function setTema(t){
  state.tema = t;
  body.classList.toggle('theme-light', t === 'claro');
  ls.set('doctrack_theme', t === 'claro' ? 'light' : 'dark');
  $('#tema-ico').innerHTML = t === 'claro' ? SUN : MOON;   /* igual ao common.js: ícone do tema atual */
}

function sincronizaLab(){
  document.querySelectorAll('.seg').forEach(function(s){
    s.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', String(state[s.dataset.ctl] === b.dataset.v)); });
  });
}

var tt;
function toast(html){
  var t = $('#toast'); t.innerHTML = html; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}

/* ── Eventos ───────────────────────────────────────────────────────────── */
/* Passar o mouse / focar com o teclado só acende o cartão (é CSS). O clique
   troca a vitrine; clicar de novo no selecionado — ou dar duplo clique — abre.
   No teclado é igual: Enter seleciona, Enter de novo abre. */
rail.addEventListener('click', function(e){
  var a = e.target.closest('.mod'); if(!a) return;
  e.preventDefault();
  var k = a.dataset.k;
  if(state.sel === k) abrir(k); else select(k);
});
rail.addEventListener('auxclick', function(e){ if(e.target.closest('.mod')) e.preventDefault(); });
rail.addEventListener('keydown', function(e){
  var cards = Array.prototype.slice.call(rail.querySelectorAll('.mod'));
  var i = cards.indexOf(document.activeElement); if(i < 0) return;
  var j = e.key === 'ArrowRight' ? (i + 1) % cards.length : e.key === 'ArrowLeft' ? (i - 1 + cards.length) % cards.length :
          e.key === 'Home' ? 0 : e.key === 'End' ? cards.length - 1 : null;
  if(j != null){ e.preventDefault(); cards[j].focus(); }
});
document.addEventListener('keydown', function(e){
  if(e.target !== body) return;
  if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    e.preventDefault();
    var cards = Array.prototype.slice.call(rail.querySelectorAll('.mod'));
    var i = cards.findIndex(function(a){ return a.dataset.k === state.sel; });
    cards[(i + (e.key === 'ArrowRight' ? 1 : -1) + cards.length) % cards.length].focus();
  } else if(e.key === 'Enter'){ abrir(state.sel); }
});
$('#v-cta').addEventListener('click', function(e){ e.preventDefault(); abrir(state.sel); });
document.querySelectorAll('[data-nav]').forEach(function(a){
  a.addEventListener('click', function(e){ e.preventDefault(); toast('Protótipo: aqui iria para <b>' + a.dataset.nav + '</b>'); });
});
$('#tema').addEventListener('click', function(){ setTema(state.tema === 'claro' ? 'escuro' : 'claro'); sincronizaLab(); });
$('#sino').addEventListener('click', function(){ toast('No app, aqui abre o painel do sino real (notificacoes-widget.js)'); });

$('#lab-tg').addEventListener('click', function(){
  var lab = $('#lab'), abre = lab.dataset.open !== 'true';
  lab.dataset.open = String(abre); this.setAttribute('aria-expanded', String(abre));
});
$('#lab').addEventListener('click', function(e){
  var b = e.target.closest('.seg button'); if(!b) return;
  var ctl = b.parentElement.dataset.ctl, v = b.dataset.v;
  if(ctl === 'perfil'){ state.perfil = v; renderRail(); }
  else if(ctl === 'tema'){ setTema(v); }
  else if(ctl === 'anim'){ state.anim = v; body.classList.toggle('motion-off', v === 'reduzida'); if(v === 'reduzida') zeraPeso(); }
  else if(ctl === 'pend'){ state.pend = v; renderRail(); atualizaSino(); }
  sincronizaLab();
});

/* ── Peso da vitrine ───────────────────────────────────────────────────
   O lado sob o mouse afunda, como se a vitrine tivesse massa: a posição
   segue o mouse por uma mola (chega com atraso e balança de leve) e volta
   ao plano ao sair. Medimos o #stage, que não inclina, para a medida não
   tremer junto com a própria inclinação. Só com mouse e animação ligada. */
var stage = $('#stage');
var T = { x:0, y:0, vx:0, vy:0, tx:0, ty:0, mx:0, my:0, tmx:0, tmy:0, dentro:false, raf:0 };
var INCL_X = 12, INCL_Y = 7;          /* graus por unidade; posição vai de -0,5 a 0,5 */
var MOLA = 0.05, AMORTECE = 0.76;     /* menor MOLA = mais pesada; maior AMORTECE = mais balanço */
function animando(){ return !body.classList.contains('motion-off'); }
function agenda(){ if(!T.raf) T.raf = requestAnimationFrame(passo); }
function passo(){
  T.raf = 0;
  T.vx = (T.vx + (T.tx - T.x) * MOLA) * AMORTECE;
  T.vy = (T.vy + (T.ty - T.y) * MOLA) * AMORTECE;
  T.x += T.vx; T.y += T.vy;
  T.mx += (T.tmx - T.mx) * 0.06; T.my += (T.tmy - T.my) * 0.06;
  var resto = Math.abs(T.tx - T.x) + Math.abs(T.ty - T.y) + Math.abs(T.vx) + Math.abs(T.vy);
  var restoFundo = Math.abs(T.tmx - T.mx) + Math.abs(T.tmy - T.my);
  if(!T.dentro && resto < 0.0005){
    /* Assentou no plano: tira o transform para o texto voltar a ficar nítido. */
    T.x = T.y = T.vx = T.vy = 0; vit.style.transform = '';
  } else {
    vit.style.transform = 'perspective(1400px) rotateX(' + (-T.y * INCL_X).toFixed(3) + 'deg) rotateY(' + (T.x * INCL_Y).toFixed(3) + 'deg)';
  }
  stage.style.setProperty('--px', T.x.toFixed(4));
  stage.style.setProperty('--py', T.y.toFixed(4));
  body.style.setProperty('--mx', T.mx.toFixed(4));
  body.style.setProperty('--my', T.my.toFixed(4));
  if(resto >= 0.0005 || restoFundo >= 0.0005) agenda();
}
stage.addEventListener('pointermove', function(e){
  if(e.pointerType !== 'mouse' || !animando()) return;
  var r = stage.getBoundingClientRect();
  T.tx = Math.min(.5, Math.max(-.5, (e.clientX - r.left) / r.width - .5));
  T.ty = Math.min(.5, Math.max(-.5, (e.clientY - r.top) / r.height - .5));
  vit.style.setProperty('--gx', Math.round(e.clientX - r.left) + 'px');
  vit.style.setProperty('--gy', Math.round(e.clientY - r.top) + 'px');
  if(!T.dentro){ T.dentro = true; vit.classList.add('pesando'); }
  agenda();
});
stage.addEventListener('pointerleave', function(){
  T.dentro = false; T.tx = T.ty = 0; vit.classList.remove('pesando'); agenda();
});
/* A malha do fundo desliza poucos pixels com o mouse, na página toda. */
document.addEventListener('pointermove', function(e){
  if(e.pointerType !== 'mouse' || !animando()) return;
  T.tmx = e.clientX / innerWidth - .5; T.tmy = e.clientY / innerHeight - .5;
  agenda();
});
function zeraPeso(){
  T.x = T.y = T.vx = T.vy = T.tx = T.ty = T.mx = T.my = T.tmx = T.tmy = 0; T.dentro = false;
  vit.style.transform = ''; vit.classList.remove('pesando');
  stage.style.setProperty('--px', '0'); stage.style.setProperty('--py', '0');
  body.style.setProperty('--mx', '0'); body.style.setProperty('--my', '0');
}

/* Aba em segundo plano: nada anima. */
document.addEventListener('visibilitychange', function(){ body.classList.toggle('paused', document.hidden); });

/* ── Início ────────────────────────────────────────────────────────────── */
var agora = new Date(), hh = agora.getHours();
$('#saud').textContent = hh < 12 ? 'Bom dia' : hh < 18 ? 'Boa tarde' : 'Boa noite';
$('#hora').textContent = ('0' + hh).slice(-2) + ':' + ('0' + agora.getMinutes()).slice(-2);
setTema(state.tema);
body.classList.toggle('motion-off', state.anim === 'reduzida');
renderRail();
atualizaDica();
atualizaSino();
sincronizaLab();
})();
</script>
</body>
</html>
