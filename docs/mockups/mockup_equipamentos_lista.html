<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup — Equipamentos: lista + ficha editável</title>
<style>
  :root{
    --bg:#0e1430;--surface:#1a2147;--surface2:#212a55;--line:#2c386b;
    --t1:#eaf0ff;--t2:#aab4e0;--t3:#7b86bd;
    --cyan:#22d3ee;--green:#34d399;--amber:#fbbf24;--red:#fb7185;--purple:#a78bfa;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--t1);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding:26px;}
  .wrap{max-width:1080px;margin:0 auto;}
  h1{font-size:22px;font-weight:700;margin:0;}
  .sub{font-size:13px;color:var(--t3);margin:4px 0 0;}
  .muted{color:var(--t3);}
  .btn{background:var(--surface2);border:1px solid var(--line);color:var(--t1);border-radius:9px;padding:8px 13px;font-size:13px;cursor:pointer;}
  .btn:hover{border-color:var(--cyan);}
  .btn.primary{background:linear-gradient(90deg,var(--cyan),#3b82f6);border:none;color:#06121f;font-weight:700;}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0;}
  .toolbar input,.toolbar select{background:var(--surface2);border:1px solid var(--line);color:var(--t1);border-radius:9px;padding:8px 11px;font-size:13px;}
  .toolbar .spacer{flex:1;}

  /* grid de cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px;}
  .eqcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:0 var(--radius) var(--radius) 0;padding:14px 16px;cursor:pointer;transition:.12s;position:relative;}
  .eqcard:hover{transform:translateY(-2px);border-color:var(--line);border-left-color:inherit;}
  .eqcard.g{border-left-color:var(--green);} .eqcard.a{border-left-color:var(--amber);} .eqcard.r{border-left-color:var(--red);}
  .eqcard .nm{font-size:14px;font-weight:700;padding-right:46px;line-height:1.3;}
  .eqcard .sku{font-size:12px;color:var(--t3);margin-top:3px;}
  .eqcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .chip{font-size:10px;padding:3px 8px;border-radius:7px;background:var(--surface2);color:var(--t2);}
  .chip.bloq{background:#3a2030;color:var(--red);}
  .ring{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;}
  .ring::after{content:"";position:absolute;inset:4px;background:var(--surface);border-radius:50%;}
  .ring span{position:relative;z-index:2;}

  /* overlay + ficha */
  .overlay{position:fixed;inset:0;background:rgba(5,8,22,.66);display:none;align-items:flex-start;justify-content:center;padding:34px 16px;z-index:50;overflow:auto;}
  .overlay.open{display:flex;}
  .sheet{width:760px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .sheet-head{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .sheet-head .nm{font-size:18px;font-weight:700;display:flex;align-items:center;gap:9px;}
  .dot{width:10px;height:10px;border-radius:50%;}
  .sheet-head .sk{font-size:12px;color:var(--t3);margin-top:3px;}
  .x{background:none;border:none;color:var(--t2);font-size:20px;cursor:pointer;}

  .tabs{display:flex;gap:2px;overflow-x:auto;padding:6px 22px 0;border-bottom:1px solid var(--line);}
  .tab{flex-shrink:0;padding:9px 14px;font-size:12px;background:none;border:none;color:var(--t3);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}
  .tab.active{color:var(--t1);font-weight:700;border-bottom-color:var(--cyan);}
  .panel{display:none;padding:18px 22px;}
  .panel.active{display:block;}

  .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .fld{margin-bottom:12px;}
  .fld label{display:block;font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
  .fld input,.fld select,.fld textarea{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--t1);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;}
  .fld textarea{min-height:90px;resize:vertical;line-height:1.5;}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--cyan);}
  .seclabel{font-size:10px;color:var(--cyan);letter-spacing:1px;text-transform:uppercase;margin:6px 0 12px;}
  .row-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);}
  .sheet-foot{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-top:1px solid var(--line);}

  .doclist{display:flex;flex-direction:column;gap:7px;}
  .docrow{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:9px;padding:9px 12px;font-size:13px;}
  .docrow .dd{width:8px;height:8px;border-radius:50%;}
  .docrow .st{margin-left:auto;font-size:11px;color:var(--t3);}
  .hist{font-size:12px;color:var(--t2);}
  .hist .hl{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);}
  .hist .hl .when{color:var(--t3);white-space:nowrap;}
  .pill{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Equipamentos</h1>
  <p class="sub">Lista de produtos — cards com completude (ICE). Clique para abrir a ficha editável.</p>

  <div class="toolbar">
    <input id="busca" placeholder="Buscar nome ou SKU…" style="width:200px">
    <select id="fcat"><option value="">Categoria: todas</option></select>
    <select id="fstatus"><option value="">Status: todos</option></select>
    <label class="row-check"><input type="checkbox" id="fbloq"> incluir bloqueados</label>
    <div class="spacer"></div>
    <button class="btn">Importar planilha</button>
    <button class="btn primary">+ Novo equipamento</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="ov" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const CAD=['sku_venda','sku_import','nome_com','nome_tec','categoria','familia','linha','fabricante'];
const REG=['anvisa','registro','validade_ok','classe_risco'];
const TIPOS=[['IT','Instrução de Trabalho','Homologado'],['Checklist','Checklist','Elaborar'],['Manual_Usuario','Manual do Usuário PT','Concluído'],['Manual_ES','Manual do Usuário ES','Em andamento'],['Manual_Servico','Manual de Serviço','Concluído'],['Spare_Parts','Spare Parts','Elaborar'],['Dossie','Dossiê','Elaborar'],['Guia_Instalacao','Guia de Instalação','Em andamento'],['QIQOQD','QI/QO/QD','Concluído']];

const EQ=[
  {id:1,nome:'AmpliGene Lite',nome_tec:'AMPLIGENE LITE - TERMOCICLADOR GRADIENTE',sku:'01.000889',skui:'02.000860',cat:'PCR',fam:'AmpliGene',lin:'Termocicladores',fab:'Yooning',status:'Ativo',bloq:false,anvisa:'80012345678',cad:8,reg:4,doc:9,desc:'Termociclador de bancada com gradiente de temperatura para amplificação de DNA por PCR convencional. 96 poços, tampa aquecida, rampa rápida.'},
  {id:2,nome:'AmpliGene Plus',nome_tec:'AMPLIGENE PLUS - TERMOCICLADOR GRADIENTE',sku:'01.000920',skui:'PC-96P',cat:'PCR',fam:'AmpliGene',lin:'Termocicladores',fab:'Yooning',status:'Ativo',bloq:false,anvisa:'80012345679',cad:8,reg:3,doc:6,desc:''},
  {id:3,nome:'Amplio 16',nome_tec:'SISTEMA DE PCR EM TEMPO REAL - AMPLIO 16 (4)',sku:'01.001205',skui:'02.000730',cat:'PCR',fam:'Amplio',lin:'PCR Tempo Real',fab:'',status:'Ativo',bloq:false,anvisa:'80012300000',cad:7,reg:1,doc:4,desc:''},
  {id:4,nome:'Amplio RX',nome_tec:'SISTEMA DE PCR EM TEMPO REAL - AMPLIO RX',sku:'01.000918',skui:'02.000939',cat:'PCR',fam:'Amplio',lin:'PCR Tempo Real',fab:'',status:'Ativo',bloq:false,anvisa:'',cad:7,reg:0,doc:2,desc:''},
  {id:5,nome:'Extracta 32',nome_tec:'SISTEMA AUTOMATIZADO PARA EXTRAÇÃO DNA/RNA E PROTEÍNAS - EXTRACTA 32',sku:'01.000162',skui:'02.000111',cat:'Extração',fam:'Extracta',lin:'Extração NA',fab:'Loccus',status:'Ativo',bloq:false,anvisa:'80055500011',cad:8,reg:3,doc:7,desc:'Sistema automatizado de extração e purificação de ácidos nucleicos e proteínas para até 32 amostras por corrida.'},
  {id:6,nome:'Extracta Station 4800',nome_tec:'SISTEMA AUTOMATIZADO DE WORKFLOW PARA PCR – EXTRACTA STATION 4800',sku:'01.000355',skui:'',cat:'Extração',fam:'Extracta',lin:'Workflow',fab:'Loccus',status:'Ativo',bloq:false,anvisa:'',cad:5,reg:0,doc:0,desc:''},
  {id:7,nome:'Centricis MF48',nome_tec:'CENTRICIS MF48 - CENTRÍFUGA LABORATORIAL DE BANCADA',sku:'1.000408',skui:'02.000222',cat:'Centrífuga',fam:'Centricis',lin:'Bancada',fab:'Loccus',status:'Ativo',bloq:false,anvisa:'80077700022',cad:8,reg:4,doc:8,desc:'Centrífuga laboratorial de bancada, rotor para microtubos e placas, até 15.000 rpm.'},
  {id:8,nome:'DB-HCS (220V)',nome_tec:'DB-HCS (220V) - BANHO TIPO BLOCO SECO COM AGITAÇÃO',sku:'1.000379',skui:'02.000333',cat:'Banho Seco',fam:'DB',lin:'Banhos',fab:'Loccus',status:'Ativo',bloq:false,anvisa:'',cad:7,reg:0,doc:1,desc:''},
  {id:9,nome:'Fluo-200 Mini',nome_tec:'MINI FLUORÔMETRO - FLUO-200 MINI',sku:'01.000512',skui:'02.000444',cat:'Fluorímetro',fam:'Fluo',lin:'Quantificação',fab:'',status:'Ativo',bloq:false,anvisa:'',cad:6,reg:0,doc:2,desc:''},
  {id:10,nome:'FlexVortex 2',nome_tec:'OBSOLETO - AGITADOR TIPO VORTEX - FLEXVORTEX 2',sku:'01.000777',skui:'',cat:'Agitador',fam:'FlexVortex',lin:'Agitadores',fab:'Loccus',status:'Obsoleto',bloq:true,anvisa:'',cad:7,reg:0,doc:9,desc:'Agitador tipo vórtex de bancada (linha descontinuada).'},
];

const pct=(f,t)=>Math.round(f/t*100);
function ice(e){const c=pct(e.cad,8),r=pct(e.reg,4),d=pct(e.doc,9);return {c,r,d,ice:Math.round((c+r+d)/3)};}
const colOf=v=>v>=85?'g':v>=50?'a':'r';
const CSS={g:'var(--green)',a:'var(--amber)',r:'var(--red)'};
const stColor=s=>s==='Homologado'||s==='Concluído'?'var(--green)':s==='Elaborar'?'var(--red)':'var(--amber)';

function uniq(a){return [...new Set(a)].sort();}
uniq(EQ.map(e=>e.cat)).forEach(v=>{const o=new Option(v,v);document.getElementById('fcat').add(o);});
uniq(EQ.map(e=>e.status)).forEach(v=>{const o=new Option(v,v);document.getElementById('fstatus').add(o);});

function renderGrid(){
  const q=document.getElementById('busca').value.toLowerCase();
  const cat=document.getElementById('fcat').value, st=document.getElementById('fstatus').value, inc=document.getElementById('fbloq').checked;
  const list=EQ.filter(e=>(inc||!e.bloq)&&(!cat||e.cat===cat)&&(!st||e.status===st)&&(!q||e.nome.toLowerCase().includes(q)||e.sku.includes(q)||e.nome_tec.toLowerCase().includes(q)));
  document.getElementById('grid').innerHTML=list.map(e=>{
    const s=ice(e),col=colOf(s.ice);
    return `<div class="eqcard ${col}" onclick="openSheet(${e.id})">
      <div class="ring" style="background:conic-gradient(${CSS[col]} ${s.ice*3.6}deg, var(--surface2) 0)"><span>${s.ice}%</span></div>
      <div class="nm">${e.nome}</div>
      <div class="sku">SKU ${e.sku}</div>
      <div class="meta"><span class="chip">${e.cat}</span><span class="chip">${e.fam}</span>${e.bloq?`<span class="chip bloq">${e.status}</span>`:''}</div>
    </div>`;
  }).join('') || '<p class="muted">Nenhum equipamento no recorte.</p>';
}

function fld(label,val,id,ph){return `<div class="fld"><label>${label}</label><input id="${id}" value="${val||''}" placeholder="${ph||''}"></div>`;}
function openSheet(id){
  const e=EQ.find(x=>x.id===id),s=ice(e),col=colOf(s.ice);
  document.getElementById('sheet').innerHTML=`
    <div class="sheet-head">
      <div>
        <div class="nm"><span class="dot" style="background:${CSS[col]}"></span>${e.nome}</div>
        <div class="sk">SKU ${e.sku} · ICE ${s.ice}% · ${e.status}</div>
      </div>
      <button class="x" onclick="closeSheet()">×</button>
    </div>
    <div class="tabs">
      ${['Geral','Técnico','Regulatório','Documentos','Histórico'].map((t,i)=>`<button class="tab ${i===0?'active':''}" onclick="tab(this,'p${i}')">${t}</button>`).join('')}
    </div>

    <div class="panel active" id="p0">
      <div class="seclabel">Identidade</div>
      <div class="g3">
        ${fld('Código interno',e.cod,'')}${fld('SKU de Venda',e.sku,'')}${fld('SKU de Importação',e.skui,'','—')}
      </div>
      <div class="g2">
        ${fld('Nome comercial',e.nome,'')}${fld('Nome técnico',e.nome_tec,'')}
      </div>
      <div class="g3">
        ${fld('Categoria',e.cat,'')}${fld('Família',e.fam,'')}${fld('Linha de produto',e.lin,'')}
      </div>
      <div class="g2">
        <div class="fld"><label>Status</label><select><option ${e.status==='Ativo'?'selected':''}>Ativo</option><option ${e.status==='Obsoleto'?'selected':''}>Obsoleto</option><option ${e.status==='Descontinuado'?'selected':''}>Descontinuado</option></select></div>
        <div class="fld"><label>Bloqueado</label><label class="row-check" style="padding-top:9px"><input type="checkbox" ${e.bloq?'checked':''}> equipamento bloqueado</label></div>
      </div>
      <div class="seclabel" style="margin-top:6px">Descritivo</div>
      <div class="fld"><label>Descrição do equipamento</label><textarea placeholder="Texto livre descrevendo o equipamento: aplicação, princípio, diferenciais…">${e.desc||''}</textarea></div>
      <div class="fld"><label>Observações (internas)</label><textarea placeholder="Anotações internas, restrições, pendências…" style="min-height:60px"></textarea></div>
    </div>

    <div class="panel" id="p1">
      <div class="seclabel">Informações técnicas</div>
      <div class="g2">${fld('Fabricante',e.fab,'','—')}${fld('Modelo','','')}</div>
      <div class="g2">${fld('Tecnologia','','','ex.: PCR em tempo real')}${fld('Aplicação','','')}</div>
      <div class="g2">${fld('Condições de armazenamento','','')}${fld('Condições de transporte','','')}</div>
      <p class="muted" style="font-size:11px">Campos técnicos avançados crescem por fase — só os usados aparecem.</p>
    </div>

    <div class="panel" id="p2">
      <div class="seclabel">Informações regulatórias</div>
      <div class="g2">${fld('Registro ANVISA',e.anvisa,'','—')}${fld('Número de processo','','')}</div>
      <div class="g3">${fld('Classe de risco','','','I / II / III / IV')}${fld('Data de registro','','','dd/mm/aaaa')}${fld('Validade','','','dd/mm/aaaa')}</div>
      <div class="g2">${fld('Situação regulatória','','')}${fld('Responsável regulatório','','')}</div>
    </div>

    <div class="panel" id="p3">
      <div class="seclabel">Documentos vinculados (${e.doc}/9 finalizados)</div>
      <div class="doclist">
        ${TIPOS.map(([k,l,st])=>`<div class="docrow"><span class="dd" style="background:${stColor(st)}"></span>${l}<span class="st">${st}</span></div>`).join('')}
      </div>
      <p class="muted" style="font-size:11px;margin-top:10px">Abre o modal de 9 abas já existente no módulo de Documentos.</p>
    </div>

    <div class="panel" id="p4">
      <div class="seclabel">Histórico de alterações</div>
      <div class="hist">
        <div class="hl"><span class="when">25/06 11:30</span><span>Identidade atualizada: ANVISA, família — por admin@pde.com</span></div>
        <div class="hl"><span class="when">24/06 16:02</span><span>Status do documento IT → Homologado — por melk@…</span></div>
        <div class="hl"><span class="when">20/06 09:14</span><span>Equipamento criado pela importação da planilha mestra</span></div>
      </div>
    </div>

    <div class="sheet-foot">
      <button class="btn" style="border-color:#5a2030;color:var(--red)">Excluir</button>
      <div><button class="btn" onclick="closeSheet()">Fechar</button> <button class="btn primary">Salvar alterações</button></div>
    </div>`;
  document.getElementById('ov').classList.add('open');
}
function tab(btn,pid){
  btn.parentElement.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===pid));
}
function closeSheet(){document.getElementById('ov').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
['busca','fcat','fstatus','fbloq'].forEach(id=>document.getElementById(id).addEventListener('input',renderGrid));
renderGrid();
</script>
</body>
</html>
